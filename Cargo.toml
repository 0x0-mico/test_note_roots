[package]
name = "test_storagemap"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
miden-assembly = "0.22"
miden-client = { version = "0.14.8", features = ["testing", "tonic"] }
miden-client-sqlite-store = { version = "0.14.8" }
miden-core = "0.22.1"
miden-protocol = { version = "0.14.5", default-features = false, features = [
  "testing",
] }
miden-standards = "0.14.5"
miden-tx = "0.14.5"
rand = { version = "0.9" }
tokio = { version = "1.46", features = [
  "fs",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
] }
